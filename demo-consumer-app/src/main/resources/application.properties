# ═══════════════════════════════════════════════════════════
#  JWT Auth Starter — Demo Consumer App Configuration
# ═══════════════════════════════════════════════════════════

# ── JWT Settings (picked up by JwtProperties in the starter) ─
# Secret: Base64-encoded, min 32 chars. Decodes to:
#         "this-is-a-secure-jwt-secret-key-for-devlib-starter!"
auth.jwt.secret=dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2bGliLXN0YXJ0ZXIh

# 1 hour expiration
auth.jwt.expiration=3600000

# These endpoints do NOT require a JWT token
auth.jwt.public-endpoints=/api/auth/**,/api/public/**,/actuator/**,/h2-console/**

# Standard defaults — no need to change
auth.jwt.token-prefix=Bearer
auth.jwt.header-name=Authorization

# ── H2 In-Memory Database ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ────────────────────────────────────────────────
server.port=8080

# ── Logging ───────────────────────────────────────────────
# Set DEBUG to see JWT processing logs from the starter
logging.level.com.devlib.auth=INFO
logging.level.org.springframework.security=WARN
logging.level.com.example.demo=DEBUG
